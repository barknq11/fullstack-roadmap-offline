<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Roadmaps (Offline)</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent-dark:#1d4ed8;--hover:#f1f5f9;--active-bg:#dbeafe;--active-text:#1d4ed8;--code-bg:#f1f5f9;--pre-bg:#0f172a;--pre-text:#e2e8f0;--graph-bg:#f8fafc;--tooltip-bg:#0f172a;--tooltip-text:#fff;--graph-btn-bg:#fff;--graph-btn-hover:#f1f5f9;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);--shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);--radius:12px;--radius-sm:8px;--radius-xs:6px;--status-completed:#16a34a;--status-inprogress:#f59e0b;--status-notstarted:#94a3b8;--status-completed-bg:#dcfce7;--status-inprogress-bg:#fef3c7;--status-notstarted-bg:#f1f5f9;--graph-completed:#22c55e;--graph-inprogress:#fbbf24;--filter-active-bg:var(--accent);--filter-active-text:#fff;--badge-video-bg:#fee2e2;--badge-video-text:#991b1b;--badge-article-bg:#dbeafe;--badge-article-text:#1d4ed8;--badge-official-bg:#dcfce7;--badge-official-text:#166534;--badge-opensource-bg:#f3e8ff;--badge-opensource-text:#6b21a8;--badge-course-bg:#fef3c7;--badge-course-text:#92400e;--badge-feed-bg:#e0f2fe;--badge-feed-text:#075985;--badge-default-bg:#f1f5f9;--badge-default-text:#64748b}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--accent-dark:#93bbfc;--hover:#334155;--active-bg:#1e3a5f;--active-text:#93c5fd;--code-bg:#1e293b;--pre-bg:#020617;--pre-text:#e2e8f0;--graph-bg:#0f172a;--tooltip-bg:#e2e8f0;--tooltip-text:#0f172a;--graph-btn-bg:#1e293b;--graph-btn-hover:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 6px rgba(0,0,0,.3);--shadow-lg:0 10px 15px rgba(0,0,0,.4);--status-completed:#22c55e;--status-inprogress:#fbbf24;--status-notstarted:#64748b;--status-completed-bg:#052e16;--status-inprogress-bg:#422006;--status-notstarted-bg:#1e293b;--graph-completed:#22c55e;--graph-inprogress:#fbbf24;--badge-video-bg:#450a0a;--badge-video-text:#fca5a5;--badge-article-bg:#1e3a5f;--badge-article-text:#93c5fd;--badge-official-bg:#052e16;--badge-official-text:#86efac;--badge-opensource-bg:#2e1065;--badge-opensource-text:#d8b4fe;--badge-course-bg:#451a03;--badge-course-text:#fcd34d;--badge-feed-bg:#0c4a6e;--badge-feed-text:#7dd3fc;--badge-default-bg:#1e293b;--badge-default-text:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .2s,color .2s;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ===== HEADER ===== */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:0 28px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);transition:background .2s,border .2s;flex-shrink:0}
.header-row{display:flex;align-items:center;gap:16px;padding:14px 0 8px}
.header-row h1{font-size:20px;font-weight:700;flex:1;display:flex;align-items:center;gap:10px}
.header-row h1 .logo{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.header-row h1 span.app-name{color:var(--text)}
.search-global{position:relative;flex:0 0 320px}
.search-global input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.search-global input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-global .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search-global .search-shortcut{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);background:var(--hover);padding:2px 6px;border-radius:4px;border:1px solid var(--border);pointer-events:none}
.theme-toggle{background:var(--hover);border:1px solid var(--border);border-radius:var(--radius-sm);width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--muted);font-size:18px;flex-shrink:0}
.theme-toggle:hover{background:var(--border);color:var(--text)}

/* Breadcrumbs */
.breadcrumbs{display:flex;align-items:center;gap:6px;padding:0 0 10px;font-size:13px;color:var(--muted)}
.breadcrumbs a{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:500}
.breadcrumbs a:hover{text-decoration:underline}
.breadcrumbs .sep{color:var(--border);font-size:11px}
.breadcrumbs .current{color:var(--text);font-weight:600}

/* ===== HOME PAGE (Roadmap.sh Layout) ===== */
.home-wrap{padding:0;flex:1;overflow-y:auto}
.home-layout{display:flex;min-height:100%}
.home-sidebar{width:280px;min-width:280px;padding:32px 24px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.home-sidebar-header{margin-bottom:24px}
.home-sidebar-header h1{font-size:24px;font-weight:800;margin-bottom:8px;line-height:1.2}
.home-sidebar-header p{font-size:14px;color:var(--muted);line-height:1.5}
.home-search{position:relative;margin-bottom:24px}
.home-search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.home-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.home-search .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.category-nav{display:flex;flex-direction:column;gap:2px}
.category-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;color:var(--text);transition:all .15s}
.category-item:hover{background:var(--hover)}
.category-item.active{background:var(--active-bg);color:var(--active-text);font-weight:600}
.category-count{font-size:12px;color:var(--muted);font-weight:400;min-width:20px;text-align:right}
.home-main{flex:1;padding:32px 40px 60px;min-width:0}
.roadmap-section{margin-bottom:32px}
.roadmap-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px;padding-left:4px}
.roadmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.roadmap-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.roadmap-card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.roadmap-card-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.roadmap-card-icon{width:36px;height:36px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.roadmap-card-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roadmap-card-bookmark{width:32px;height:32px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;flex-shrink:0;transition:all .15s;border:1px solid transparent}
.roadmap-card-bookmark:hover{background:var(--hover);color:var(--accent);border-color:var(--border)}
.roadmap-card-bookmark.active{color:var(--accent)}
/* Responsive */
@media(max-width:900px){.home-sidebar{width:240px;min-width:240px}.home-main{padding:24px 20px}}
@media(max-width:700px){.home-layout{flex-direction:column}.home-sidebar{width:100%;min-width:0;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border);padding:20px 16px}.home-main{padding:16px}.roadmap-grid{grid-template-columns:1fr}}

/* ===== ROADMAP VIEW ===== */
.view-wrap{display:flex;flex:1;overflow:hidden}
.view-wrap.graph-mode{flex-direction:column}

/* Sidebar */
.sidebar{width:340px;min-width:340px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,min-width .2s,transform .2s}
.sidebar.collapsed{width:0;min-width:0;border-right:none;overflow:hidden}
.sidebar-toggle{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:20;width:24px;height:48px;background:var(--card);border:1px solid var(--border);border-left:none;border-radius:0 var(--radius-xs) var(--radius-xs) 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;transition:all .15s}
.sidebar-toggle:hover{background:var(--hover);color:var(--text)}
.sidebar-header{padding:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.progress-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-badge{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--hover);color:var(--text)}
.stat-badge .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.filter-row{display:flex;gap:4px}
.filter-btn{flex:1;padding:6px 8px;border-radius:var(--radius-xs);cursor:pointer;font-size:11px;font-weight:600;text-align:center;color:var(--muted);background:transparent;border:1px solid var(--border);transition:all .15s}
.filter-btn:hover{background:var(--hover)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.topic-search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);outline:none;margin:0 16px;width:calc(100% - 32px);transition:border .15s}
.topic-search:focus{border-color:var(--accent)}
.topics-scroll{flex:1;overflow-y:auto;padding:8px 12px 20px}
.phase{margin-bottom:14px}
.phase-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.phase-label .phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.topic-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-xs);cursor:pointer;font-size:13px;color:var(--text);transition:background .12s}
.topic-item:hover{background:var(--hover)}
.topic-item.active{background:var(--active-bg);color:var(--active-text);font-weight:600}
.topic-item .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--border);transition:all .15s}
.topic-item .status-dot.completed{background:var(--status-completed);border-color:var(--status-completed)}
.topic-item .status-dot.in-progress{background:var(--status-inprogress);border-color:var(--status-inprogress)}
.topic-item .status-dot.not-started{background:transparent;border-color:var(--status-notstarted)}
.topic-item .res-badge{margin-left:auto;font-size:10px;color:var(--muted);background:var(--hover);padding:1px 6px;border-radius:10px}

/* Main content */
.main-content{flex:1;overflow-y:auto;padding:28px 36px 60px;display:flex;flex-direction:column}
.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;color:var(--muted)}
.welcome-screen h2{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.welcome-screen p{font-size:14px;max-width:400px}
.topic-detail{max-width:780px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.topic-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topic-header h2{font-size:24px;font-weight:800}
.phase-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.status-bar{display:flex;gap:6px;margin-bottom:24px}
.sbtn{padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:5px}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.active-ns{background:var(--status-notstarted-bg);border-color:var(--status-notstarted);color:var(--status-notstarted)}
.sbtn.active-ip{background:var(--status-inprogress-bg);border-color:var(--status-inprogress);color:var(--status-inprogress)}
.sbtn.active-c{background:var(--status-completed-bg);border-color:var(--status-completed);color:var(--status-completed)}
.content-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);transition:background .2s,border .2s}
.content-card h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.content-card .desc{font-size:14px;line-height:1.7;color:var(--text)}
.content-card .desc p{margin-bottom:10px}
.content-card .desc a{color:var(--accent);text-decoration:none;font-weight:500}
.content-card .desc a:hover{text-decoration:underline}
.content-card .desc code{background:var(--code-bg);padding:2px 6px;border-radius:4px;font-size:13px}
.content-card .desc pre{background:var(--pre-bg);color:var(--pre-text);padding:14px;border-radius:var(--radius-sm);overflow-x:auto;margin:10px 0;font-size:13px}
.content-card .desc ul,.content-card .desc ol{padding-left:20px;margin:8px 0}
.content-card .desc li{margin-bottom:4px}
.resource-list{list-style:none;padding:0}
.resource-list li{margin-bottom:8px}
.resource-link{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);text-decoration:none;color:var(--text);border:1px solid var(--border);transition:all .15s;font-size:13px}
.resource-link:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.res-type{font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.type-video{background:var(--badge-video-bg);color:var(--badge-video-text)}
.type-article{background:var(--badge-article-bg);color:var(--badge-article-text)}
.type-official{background:var(--badge-official-bg);color:var(--badge-official-text)}
.type-opensource{background:var(--badge-opensource-bg);color:var(--badge-opensource-text)}
.type-course{background:var(--badge-course-bg);color:var(--badge-course-text)}
.type-feed{background:var(--badge-feed-bg);color:var(--badge-feed-text)}
.type-default{background:var(--badge-default-bg);color:var(--badge-default-text)}
.res-title{font-weight:500}
.notes-area{width:100%;min-height:100px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;resize:vertical;background:var(--bg);color:var(--text);outline:none;transition:border .15s;line-height:1.6}
.notes-area:focus{border-color:var(--accent)}
.notes-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:600}
.notes-timestamp{font-size:11px;color:var(--muted);font-weight:400}

/* Graph */
.graph-wrap{flex:1;position:relative;overflow:hidden;background:var(--graph-bg);transition:background .2s;display:flex;flex-direction:column}
.graph-controls{position:absolute;bottom:16px;right:16px;z-index:10;display:flex;flex-direction:column;gap:4px}
.graph-btn{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--graph-btn-bg);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .12s;color:var(--text)}
.graph-btn:hover{background:var(--graph-btn-hover)}
svg.roadmap-svg{width:100%;height:100%;cursor:grab;background:var(--graph-bg)}
svg.roadmap-svg:active{cursor:grabbing}
svg.roadmap-svg .node-rect{transition:filter .15s,stroke-width .15s}
svg.roadmap-svg .node-rect:hover{filter:brightness(.95) drop-shadow(0 2px 6px rgba(0,0,0,.18))}
svg.roadmap-svg .node-rect.highlighted{stroke-width:3!important;filter:drop-shadow(0 3px 8px rgba(37,99,235,.35))}
svg.roadmap-svg .node-label{font-size:11px;font-weight:600;fill:var(--text);pointer-events:none;text-anchor:middle;dominant-baseline:central}
svg.roadmap-svg .edge-line{fill:none;stroke-width:2;stroke-linecap:round}
svg.roadmap-svg .node-title{font-size:13px;font-weight:700;fill:var(--text);pointer-events:none;text-anchor:middle;dominant-baseline:central}
svg.roadmap-svg .node-paragraph{font-size:10px;fill:var(--muted);pointer-events:none;text-anchor:middle;dominant-baseline:central}
svg.roadmap-svg .node-label-text{font-size:11px;fill:var(--muted);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.graph-tooltip{position:absolute;background:var(--tooltip-bg);color:var(--tooltip-text);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;z-index:20;white-space:nowrap;display:none;box-shadow:var(--shadow-md)}

/* Sidebar collapse button */
.sidebar-collapse-btn{position:fixed;left:340px;top:50%;transform:translateY(-50%);z-index:25;width:20px;height:40px;background:var(--card);border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;transition:left .2s,background .15s}
.sidebar-collapse-btn:hover{background:var(--hover);color:var(--text)}
.sidebar-collapse-btn.collapsed{left:0}

/* View tabs */
.view-tabs{display:flex;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.view-tab{padding:6px 12px;border-radius:var(--radius-xs);cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:transparent;border:1px solid transparent;transition:all .15s}
.view-tab:hover{color:var(--text)}
.view-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Data management */
.data-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.data-btn{padding:5px 10px;border-radius:var(--radius-xs);cursor:pointer;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s}
.data-btn:hover{border-color:var(--accent);color:var(--accent)}
.data-btn.danger:hover{border-color:#ef4444;color:#ef4444}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .2s ease}

/* Badge dots on roadmap cards */
.badge-dot{position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .3s}
.badge-dot.bronze{background:#CD7F32;border-color:#CD7F32}
.badge-dot.silver{background:#C0C0C0;border-color:#C0C0C0}
.badge-dot.gold{background:#FFD700;border-color:#FFD700}
.badge-dot.platinum{background:#E5E4E2;border-color:#E5E4E2}
@keyframes badgePulse{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.badge-dot.animate{animation:badgePulse .3s ease}

/* Continue where you left off */
.continue-banner{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:28px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.continue-banner:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--accent)}
.continue-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.continue-info{flex:1;min-width:0}
.continue-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.continue-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-meta{font-size:12px;color:var(--muted);margin-top:2px}
.continue-arrow{font-size:18px;color:var(--muted);flex-shrink:0}

/* Sidebar last-viewed */
.sidebar-lastviewed{padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;transition:background .15s}
.sidebar-lastviewed:hover{background:var(--hover)}
.sidebar-lastviewed strong{color:var(--accent);font-weight:600}

/* Prerequisite/LeadsTo lists */
.dep-section{margin-bottom:16px}
.dep-section h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dep-list{display:flex;flex-wrap:wrap;gap:6px}
.dep-tag{padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;background:var(--hover);color:var(--text);border:1px solid var(--border);cursor:pointer;transition:all .15s;text-decoration:none}
.dep-tag:hover{border-color:var(--accent);color:var(--accent)}
.dep-tag.prereq{background:var(--badge-article-bg);color:var(--badge-article-text);border-color:transparent}
.dep-tag.next{background:var(--badge-official-bg);color:var(--badge-official-text);border-color:transparent}

/* Expandable description */
.desc-toggle{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;transition:color .15s}
.desc-toggle:hover{color:var(--accent-dark)}

/* Project suggestions */
.project-section{margin-top:20px}
.project-section h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.project-card{background:var(--hover);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;transition:all .15s}
.project-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.project-title{font-size:13px;font-weight:700;margin-bottom:4px}
.project-desc{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.project-meta{display:flex;gap:8px;flex-wrap:wrap}
.project-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--badge-course-bg);color:var(--badge-course-text)}
.project-difficulty{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.project-difficulty.beginner{background:var(--status-completed-bg);color:var(--status-completed)}
.project-difficulty.intermediate{background:var(--status-inprogress-bg);color:var(--status-inprogress)}
.project-difficulty.advanced{background:var(--badge-video-bg);color:var(--badge-video-text)}
.project-time{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}

/* Responsive */
@media(max-width:900px){.sidebar{width:280px;min-width:280px}.sidebar-collapse-btn{left:280px}.main-content{padding:20px}.search-global{flex:0 0 200px}}
@media(max-width:700px){.view-wrap{flex-direction:column;height:auto}.sidebar{width:100%;min-width:0;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}.sidebar.collapsed{max-height:0}.sidebar-collapse-btn{display:none}.roadmap-grid{grid-template-columns:1fr}.home-wrap{padding:16px}.header-row{padding:10px 0 6px}.search-global{flex:0 0 160px}.main-content{padding:16px}.continue-banner{flex-direction:column;text-align:center}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header" id="appHeader">
  <div class="header-row">
    <h1><div class="logo">R</div><span class="app-name">Developer Roadmaps</span></h1>
    <div class="search-global" id="globalSearchWrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="globalSearch" placeholder="Search all topics... (Ctrl+K)">
      <span class="search-shortcut">Ctrl+K</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" onclick="toggleTheme()">
      <span id="themeIcon">&#9789;</span>
    </button>
  </div>
  <div class="breadcrumbs" id="breadcrumbs" style="display:none"></div>
</div>

<!-- HOME PAGE -->
<div class="home-wrap" id="homePage">
  <div class="home-layout">
    <div class="home-sidebar">
      <div class="home-sidebar-header">
        <h1>Developer Roadmaps</h1>
        <p>Community driven, up-to-date paths to learn any tool or technology.</p>
      </div>
      <div class="home-search">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="homeSearch" placeholder="Search roadmaps...">
      </div>
      <div class="category-nav" id="categoryNav"></div>
    </div>
    <div class="home-main">
      <div id="continueBanner" style="display:none"></div>
      <div id="roadmapGrid"></div>
    </div>
  </div>
</div>

<!-- ROADMAP VIEW -->
<div class="view-wrap" id="roadmapView" style="display:none">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-lastviewed" id="sidebarLastViewed" style="display:none"></div>
    <div class="sidebar-header">
      <div class="progress-stats" id="progressStats"></div>
      <div class="filter-row" id="filterRow">
        <div class="filter-btn active" data-filter="all">All</div>
        <div class="filter-btn" data-filter="in-progress">In Progress</div>
        <div class="filter-btn" data-filter="completed">Completed</div>
      </div>
    </div>
    <input type="text" class="topic-search" id="topicSearch" placeholder="Filter topics...">
    <div class="topics-scroll" id="topicList"></div>
    <div class="data-bar">
      <button class="data-btn" onclick="exportProgress()">Export</button>
      <button class="data-btn" onclick="importProgress()">Import</button>
      <button class="data-btn danger" onclick="resetProgress()">Reset</button>
    </div>
  </div>
  <button class="sidebar-collapse-btn" id="sidebarCollapse" title="Collapse sidebar">&#9664;</button>
  <div class="main-content" id="mainContent">
    <div class="welcome-screen" id="welcomeScreen">
      <h2>Select a Topic</h2>
      <p>Click any topic from the sidebar or graph to view its description and free learning resources.</p>
    </div>
    <div class="topic-detail" id="topicDetail" style="display:none"></div>
  </div>
  <div class="graph-wrap" id="graphWrap" style="display:none">
    <svg class="roadmap-svg" id="roadmapSvg"></svg>
    <div class="graph-tooltip" id="graphTooltip"></div>
    <div class="graph-controls">
      <button class="graph-btn" id="zoomIn" title="Zoom in">+</button>
      <button class="graph-btn" id="zoomOut" title="Zoom out">-</button>
      <button class="graph-btn" id="zoomFit" title="Fit to view">&#8596;</button>
    </div>
  </div>
</div>

<script>
// ===== State =====
let INDEX = null;
let DATA_CACHE = {};
let currentPage = 'home';
let currentSlug = null;
let currentView = 'list'; // 'list' or 'graph'
let selectedTopicId = null;
let currentFilter = 'all';
let graphScale=1,graphPanX=0,graphPanY=0,isPanning=false,panStartX=0,panStartY=0,panMouseDownX=0,panMouseDownY=0,didDrag=false;

// ===== Categories =====
// Categories are now loaded from INDEX.categories

// ===== Theme =====
function toggleTheme(){
  const h=document.documentElement,c=h.getAttribute('data-theme');
  const n=c==='dark'?'light':'dark';
  h.setAttribute('data-theme',n);localStorage.setItem('theme',n);
  document.getElementById('themeIcon').innerHTML=n==='dark'?'&#9728;':'&#9789;';
  if(currentView==='graph'&&currentSlug)setTimeout(()=>renderGraph(),50);
}
(function(){const s=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',s);document.getElementById('themeIcon').innerHTML=s==='dark'?'&#9728;':'&#9789;'})();

// ===== Progress =====
const PK='roadmap_progress';
function loadProgress(){try{return JSON.parse(localStorage.getItem(PK))||{}}catch(e){return{}}}
function saveProgress(d){localStorage.setItem(PK,JSON.stringify(d))}
function getTopicProgress(nid){const p=loadProgress();return p[nid]||{status:'not-started',notes:'',timestamp:null}}
function setTopicProgress(nid,upd){const p=loadProgress();p[nid]={...(p[nid]||{status:'not-started',notes:'',timestamp:null}),...upd};saveProgress(p)}
function getRoadmapProgress(slug){
  if(!INDEX)return{completed:0,inProgress:0,total:0};
  const meta=INDEX.meta[slug];if(!meta)return{completed:0,inProgress:0,total:0};
  const rd=DATA_CACHE[slug];if(!rd)return{completed:0,inProgress:0,total:0};
  const p=loadProgress();let c=0,ip=0;
  rd.topics.forEach(t=>{const s=(p[t.nodeId]||{}).status||'not-started';if(s==='completed')c++;else if(s==='in-progress')ip++});
  return{completed:c,inProgress:ip,total:rd.topics.length}
}

// ===== Last Viewed =====
const LVK='roadmap_lastviewed';
function getLastViewed(){try{return JSON.parse(localStorage.getItem(LVK))||{}}catch(e){return{}}}
function saveLastViewed(slug,topicId,topicTitle){
  const lv=getLastViewed();lv[slug]={topicId,topicTitle,timestamp:Date.now()};localStorage.setItem(LVK,JSON.stringify(lv));
}
function getLastViewedForSlug(slug){const lv=getLastViewed();return lv[slug]||null}

// ===== Badges =====
const BK='roadmap_badges';
function loadBadges(){try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return{}}}
function saveBadges(d){localStorage.setItem(BK,JSON.stringify(d))}
function getBadgeLevel(slug){
  const rd=DATA_CACHE[slug];if(!rd)return null;
  const prog=getRoadmapProgress(slug);if(prog.total===0)return null;
  const pct=prog.completed/prog.total*100;
  if(pct>=100)return'platinum';if(pct>=75)return'gold';if(pct>=50)return'silver';if(pct>=25)return'bronze';return null;
}
function checkAndAwardBadge(slug){
  const badges=loadBadges();const level=getBadgeLevel(slug);if(!level)return false;
  const prev=badges[slug]||{};const wasEarned=prev[level]||false;
  if(!wasEarned){badges[slug]={...prev,[level]:true};saveBadges(badges);return true}
  return false;
}

// ===== Projects =====
let PROJECTS=null;
async function loadProjects(){
  if(PROJECTS)return PROJECTS;
  try{const r=await fetch('data/web/projects.json');PROJECTS=await r.json();return PROJECTS}catch(e){return[]}
}
function getRelevantProjects(slug){
  if(!PROJECTS||!DATA_CACHE[slug])return[];
  const rd=DATA_CACHE[slug];const p=loadProgress();
  const completedTopics=new Set();
  rd.topics.forEach(t=>{if((p[t.nodeId]||{}).status==='completed')completedTopics.add(t.nodeId)});
  return PROJECTS.filter(proj=>{
    return proj.topics.some(pt=>rd.topics.some(t=>t.title&&t.title.toLowerCase().includes(pt.toLowerCase()))||
      rd.topics.some(t=>completedTopics.has(t.nodeId)&&t.title&&t.title.toLowerCase().includes(pt.toLowerCase())));
  }).slice(0,3);
}

// ===== Helpers =====
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderMarkdown(md){
  if(!md)return'';let lines=md.replace(/\r\n/g,'\n').split('\n'),html='',inList=false,inCode=false,cb=[];
  const closeList=()=>{if(inList){html+='</ul>';inList=false}};
  for(let i=0;i<lines.length;i++){
    let l=lines[i];
    if(l.trim().startsWith('```')){if(inCode){html+='<pre>'+esc(cb.join('\n'))+'</pre>';cb=[];inCode=false}else{closeList();inCode=true}continue}
    if(inCode){cb.push(l);continue}
    let inline=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const h=l.match(/^(#{1,4})\s+(.*)/);if(h){closeList();const lvl=h[1].length+1;html+='<h'+lvl+'>'+inline.replace(/^#{1,4}\s+/,'')+'</h'+lvl+'>';continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){closeList();html+='<hr>';continue}
    if(l.trim().startsWith('>')){closeList();html+='<blockquote>'+inline.replace(/^\s*>\s?/,'')+'</blockquote>';continue}
    if(/^\s*[-*+]\s+/.test(l)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inline.replace(/^\s*[-*+]\s+/,'')+'</li>';continue}
    if(/^\s*\d+\.\s+/.test(l)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inline.replace(/^\s*\d+\.\s+/,'')+'</li>';continue}
    if(l.trim()===''){closeList();continue}
    closeList();html+='<p>'+inline+'</p>';
  }
  closeList();if(inCode)html+='<pre>'+esc(cb.join('\n'))+'</pre>';return html;
}
const TYPE_CLASS={video:'type-video',article:'type-article',official:'type-official',opensource:'type-opensource',course:'type-course',feed:'type-feed'};
function typeClass(t){return TYPE_CLASS[t]||'type-default'}
function typeLabel(t){return({video:'Video',article:'Article',official:'Docs',opensource:'Open Source',course:'Course',feed:'Feed'})[t]||t||'Link'}
function getPhase(label){
  const l=(label||'').toLowerCase();
  if(l.includes('checkpoint'))return'Checkpoints';
  if(l.match(/html|css|javascript|npm|git|github|tailwind|react|vue|angular|svelte|webpack|vite|sass|less|typescript|dom|responsive|accessibility|seo|performance|animation|figma|ui|ux|css-in-js|styled/))return'Frontend';
  if(l.match(/node|express|rest|jwt|redis|linux|postgres|mongo|sql|graphql|backend|python|java|go|ruby|php|django|fastapi|flask|spring|api|auth|cache|queue|rabbit|kafka|docker/))return'Backend';
  if(l.match(/aws|ec2|vpc|route53|ses|s3|monit|actions|ansible|terraform|devops|ci\/cd|jenkins|kubernetes|k8s|cloud|gcp|azure|nginx|prometheus|grafana|elk|logging|incident|sre|iac|puppet|chef/))return'DevOps';
  if(l.match(/cloud|iam|lambda|dynamodb|sqs|sns|cloudfront|route\s*53|ecs|eks|rds|elastic|sam|cdk|waf/))return'AWS';
  return'Other';
}
const PHASE_COLORS={'Frontend':'#2563eb','Backend':'#16a34a','DevOps':'#ea580c','AWS':'#f59e0b','Checkpoints':'#dc2626','Other':'#64748b'};

// ===== Lazy Load =====
async function loadRoadmapData(slug){
  if(DATA_CACHE[slug])return DATA_CACHE[slug];
  try{
    const resp=await fetch('data/web/'+slug+'.json');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    DATA_CACHE[slug]=data;
    return data;
  }catch(e){
    console.error('Failed to load roadmap:',slug,e);
    return null;
  }
}

// ===== Home Page =====
let currentCategory = 'all';
let homeSearchQuery = '';

function buildHome(){
  if(!INDEX)return;
  
  // Build category navigation
  buildCategoryNav();
  
  // Build roadmap grid
  buildRoadmapGrid();
  
  // Continue where you left off banner
  buildContinueBanner();
}

function buildCategoryNav(){
  const nav=document.getElementById('categoryNav');
  if(!nav||!INDEX.categories)return;
  nav.innerHTML='';
  
  // All Roadmaps
  const allCount=INDEX.slugs.length;
  const allItem=document.createElement('div');
  allItem.className='category-item'+(currentCategory==='all'?' active':'');
  allItem.innerHTML='<span>All Roadmaps</span><span class="category-count">'+allCount+'</span>';
  allItem.addEventListener('click',()=>{currentCategory='all';buildHome()});
  nav.appendChild(allItem);
  
  // Category items
  const catOrder=['Absolute Beginners','Role Based','Languages','Frameworks','Web','DevOps & Cloud','Databases','CS Fundamentals','AI & Emerging','Best Practices','Product Design','Power BI','QA','Python','Shell'];
  catOrder.forEach(cat=>{
    const slugs=INDEX.categories[cat];
    if(!slugs||!slugs.length)return;
    const item=document.createElement('div');
    item.className='category-item'+(currentCategory===cat?' active':'');
    item.innerHTML='<span>'+esc(cat)+'</span><span class="category-count">'+slugs.length+'</span>';
    item.addEventListener('click',()=>{currentCategory=cat;buildHome()});
    nav.appendChild(item);
  });
}

function buildRoadmapGrid(){
  const main=document.getElementById('roadmapGrid');
  if(!main)return;
  main.innerHTML='';
  
  let slugsToShow=[];
  if(currentCategory==='all'){
    slugsToShow=INDEX.slugs;
  }else{
    slugsToShow=INDEX.categories[currentCategory]||[];
  }
  
  // Apply search filter
  if(homeSearchQuery){
    const q=homeSearchQuery.toLowerCase();
    slugsToShow=slugsToShow.filter(slug=>{
      const meta=INDEX.meta[slug];
      if(!meta)return false;
      return meta.title.toLowerCase().includes(q)||slug.toLowerCase().includes(q);
    });
  }
  
  // Group by category for display
  const groups={};
  slugsToShow.forEach(slug=>{
    const meta=INDEX.meta[slug];
    if(!meta)return;
    const cat=meta.category||'Other';
    if(!groups[cat])groups[cat]=[];
    groups[cat].push(slug);
  });
  
  // Build sections
  const sectionOrder=['Role Based','Languages','Frameworks','Web','DevOps & Cloud','Databases','CS Fundamentals','AI & Emerging','Absolute Beginners','Best Practices','Product Design','Power BI','QA','Python','Shell'];
  sectionOrder.forEach(cat=>{
    const slugs=groups[cat];
    if(!slugs||!slugs.length)return;
    
    const sec=document.createElement('div');
    sec.className='roadmap-section';
    sec.innerHTML='<div class="roadmap-section-title">'+esc(cat)+'</div>';
    
    const grid=document.createElement('div');
    grid.className='roadmap-grid';
    
    slugs.forEach(slug=>{
      const meta=INDEX.meta[slug];
      const card=document.createElement('div');
      card.className='roadmap-card';
      card.innerHTML='<div class="roadmap-card-left"><div class="roadmap-card-icon" style="background:'+meta.color+'">'+esc(meta.icon)+'</div><div class="roadmap-card-title">'+esc(meta.title)+'</div></div><div class="roadmap-card-bookmark" onclick="event.stopPropagation()">&#9734;</div>';
      card.addEventListener('click',()=>openRoadmap(slug));
      grid.appendChild(card);
    });
    
    sec.appendChild(grid);
    main.appendChild(sec);
  });
  
  if(slugsToShow.length===0){
    main.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">No roadmaps found</div>';
  }
}

function buildContinueBanner(){
  const banner=document.getElementById('continueBanner');
  if(!banner)return;
  const lv=getLastViewed();
  // Find most recent last-viewed across all slugs
  let mostRecent=null;let mostRecentSlug=null;
  for(const slug in lv){
    if(!mostRecent||lv[slug].timestamp>mostRecent.timestamp){mostRecent=lv[slug];mostRecentSlug=slug}
  }
  if(!mostRecent||!mostRecentSlug){banner.style.display='none';return}
  const meta=INDEX.meta[mostRecentSlug];if(!meta){banner.style.display='none';return}
  const prog=getRoadmapProgress(mostRecentSlug);
  const pct=prog.total>0?Math.round(prog.completed/prog.total*100):0;
  banner.style.display='block';
  banner.innerHTML='<div class="continue-banner" onclick="openRoadmap(\''+esc(mostRecentSlug)+'\');setTimeout(()=>selectTopic(\''+esc(mostRecent.topicId)+'\'),200)"><div class="continue-icon" style="background:'+meta.color+'">'+esc(meta.icon)+'</div><div class="continue-info"><div class="continue-label">Continue where you left off</div><div class="continue-title">'+esc(meta.title)+' &mdash; '+esc(mostRecent.topicTitle)+'</div><div class="continue-meta">'+prog.completed+'/'+prog.total+' completed ('+pct+'%)</div></div><div class="continue-arrow">&#9654;</div></div>';
}

// Home search
document.getElementById('homeSearch').addEventListener('input',e=>{
  homeSearchQuery=e.target.value.trim();
  buildRoadmapGrid();
});

// ===== Open Roadmap =====
async function openRoadmap(slug,pushState){
  currentPage='roadmap';currentSlug=slug;selectedTopicId=null;currentView='list';
  if(pushState!==false)history.pushState({slug},'','#'+slug);
  document.getElementById('homePage').style.display='none';
  document.getElementById('roadmapView').style.display='flex';
  // Set dynamic accent
  const meta=INDEX.meta[slug];
  if(meta)document.documentElement.style.setProperty('--accent',meta.color);
  // Breadcrumbs
  const bc=document.getElementById('breadcrumbs');bc.style.display='flex';
  let catName=meta?meta.category:'';
  bc.innerHTML='<a onclick="goHome()">Home</a><span class="sep">&#9656;</span>'+(catName?'<a onclick="goHome()">'+esc(catName)+'</a><span class="sep">&#9656;</span>':'')+'<span class="current">'+esc(meta?meta.title:slug)+'</span>';
  // Load roadmap data
  document.getElementById('welcomeScreen').innerHTML='<h2>Loading...</h2>';
  const rd=await loadRoadmapData(slug);
  if(!rd){document.getElementById('welcomeScreen').innerHTML='<h2>Failed to load</h2>';return}
  // View tabs
  buildViewTabs();
  buildSidebar();
  updateProgressStats();
  // Sidebar last-viewed
  const lv=getLastViewedForSlug(slug);
  const lvEl=document.getElementById('sidebarLastViewed');
  if(lv){lvEl.style.display='block';lvEl.innerHTML='Last viewed: <strong>'+esc(lv.topicTitle)+'</strong>';lvEl.onclick=()=>selectTopic(lv.topicId)}
  else{lvEl.style.display='none'}
  showWelcome();
  // Reset graph state
  document.getElementById('graphWrap').style.display='none';
  document.getElementById('mainContent').style.display='flex';
}
function goHome(pushState){
  currentPage='home';currentSlug=null;selectedTopicId=null;
  if(pushState!==false)history.pushState({page:'home'},'','#');
  document.getElementById('homePage').style.display='block';
  document.getElementById('roadmapView').style.display='none';
  document.getElementById('breadcrumbs').style.display='none';
  document.documentElement.style.removeProperty('--accent');
  buildHome();
}

// ===== View Tabs =====
function applyViewLayout(view){
  const layout=document.getElementById('mainContent');
  const graphWrap=document.getElementById('graphWrap');
  const sidebar=document.getElementById('sidebar');
  const collapse=document.getElementById('sidebarCollapse');
  sidebar.style.display='';collapse.style.display='';
  if(view==='graph'){
    layout.style.display='none';graphWrap.style.display='flex';
  }else if(view==='split'){
    layout.style.display='flex';graphWrap.style.display='flex';
    layout.style.flex='0 0 40%';graphWrap.style.flex='1';
  }else{
    layout.style.display='flex';graphWrap.style.display='none';
    layout.style.flex='1';graphWrap.style.flex='1';
  }
}
function buildViewTabs(){
  const old=document.getElementById('viewTabsContainer');if(old)old.remove();
  const mainContent=document.getElementById('mainContent');
  const wrap=document.createElement('div');wrap.id='viewTabsContainer';wrap.className='view-tabs';
  wrap.innerHTML='<div class="view-tab active" data-view="list">List</div><div class="view-tab" data-view="graph">Graph</div><div class="view-tab" data-view="split">Split</div>';
  mainContent.insertBefore(wrap,mainContent.firstChild);
  wrap.querySelectorAll('.view-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      currentView=tab.dataset.view;
      wrap.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      applyViewLayout(currentView);
      if(currentView==='graph'||currentView==='split')requestAnimationFrame(()=>{requestAnimationFrame(()=>renderGraph())});
    });
  });
}

// ===== Sidebar =====
function buildSidebar(filter){
  if(!currentSlug)return;
  const rd=DATA_CACHE[currentSlug];if(!rd)return;
  const list=document.getElementById('topicList');list.innerHTML='';
  const groups={};const progress=loadProgress();
  rd.topics.forEach(t=>{
    const label=t.title||t.nodeId;const phase=getPhase(label);
    const ps=(progress[t.nodeId]||{}).status||'not-started';
    if(filter){const q=filter.toLowerCase();const mn=label.toLowerCase().includes(q);const md=(t.description||'').toLowerCase().includes(q);const mr=(t.resources||[]).some(r=>(r.title||'').toLowerCase().includes(q)||(r.url||'').toLowerCase().includes(q));if(!mn&&!md&&!mr)return}
    if(currentFilter!=='all'&&ps!==currentFilter)return;
    if(!groups[phase])groups[phase]=[];
    groups[phase].push({...t,_label:label,_phase:phase,_status:ps});
  });
  const phaseOrder=['Frontend','Backend','DevOps','AWS','Checkpoints','Other'];
  phaseOrder.forEach(phase=>{
    if(!groups[phase]||!groups[phase].length)return;
    const div=document.createElement('div');div.className='phase';
    div.innerHTML='<div class="phase-label"><span class="phase-dot" style="background:'+(PHASE_COLORS[phase]||'#64748b')+'"></span>'+esc(phase)+' ('+groups[phase].length+')</div>';
    groups[phase].forEach(t=>{
      const item=document.createElement('div');item.className='topic-item'+(t.nodeId===selectedTopicId?' active':'');
      item.dataset.id=t.nodeId;
      const rc=(t.resources||[]).length;
      item.innerHTML='<span class="status-dot '+t._status+'"></span><span>'+esc(t._label)+'</span>'+(rc?'<span class="res-badge">'+rc+'</span>':'');
      item.addEventListener('click',()=>selectTopic(t.nodeId));
      div.appendChild(item);
    });
    list.appendChild(div);
  });
}
function updateProgressStats(){

// ===== Topic Detail =====
function selectTopic(nid,pushState){
  if(!currentSlug)return;
  const rd=DATA_CACHE[currentSlug];if(!rd)return;
  const t=rd.topics.find(x=>x.nodeId===nid);
  if(!t)return;selectedTopicId=nid;
  if(pushState!==false)history.pushState({slug:currentSlug,topicId:nid},'', '#'+currentSlug+'/'+nid);
  
  // Save last viewed
  saveLastViewed(currentSlug,nid,t.title||nid);
  
  document.querySelectorAll('.topic-item').forEach(el=>el.classList.remove('active'));
  const act=document.querySelector('.topic-item[data-id="'+nid+'"]');if(act){act.classList.add('active');act.scrollIntoView({block:'nearest'})}
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('sidebarLastViewed').style.display='none';
  const det=document.getElementById('topicDetail');det.style.display='block';
  const label=t.title||nid;const phase=getPhase(label);const prog=getTopicProgress(nid);
  let html='<div class="topic-header fade-in"><h2>'+esc(label)+'</h2><span class="phase-badge" style="background:'+(PHASE_COLORS[phase]||'#64748b')+'22;color:'+(PHASE_COLORS[phase]||'#64748b')+'">'+esc(phase)+'</span></div>';
  // Status buttons
  const s=prog.status;
  html+='<div class="status-bar fade-in">';
  html+='<button class="sbtn'+(s==='not-started'?' active-ns':'')+'" onclick="setTopicStatus(\''+esc(nid)+'\',\'not-started\')">&#9675; Not Started</button>';
  html+='<button class="sbtn'+(s==='in-progress'?' active-ip':'')+'" onclick="setTopicStatus(\''+esc(nid)+'\',\'in-progress\')">&#9654; In Progress</button>';
  html+='<button class="sbtn'+(s==='completed'?' active-c':'')+'" onclick="setTopicStatus(\''+esc(nid)+'\',\'completed\')">&#10003; Completed</button>';
  html+='</div>';
  // Prerequisites
  if(t.prerequisites&&t.prerequisites.length){
    html+='<div class="dep-section fade-in"><h4>&#128279; Prerequisites ('+t.prerequisites.length+')</h4><div class="dep-list">';
    t.prerequisites.forEach(p=>{html+='<span class="dep-tag prereq" onclick="selectTopic(\''+esc(p.nodeId)+'\')">'+esc(p.title)+'</span>'});
    html+='</div></div>';
  }
  // Description (expandable)
  if(t.fullDescription||t.description){
    const full=t.fullDescription||t.description;
    const short=t.description||'';
    const isExpandable=full.length>short.length&&full.length>300;
    html+='<div class="content-card fade-in"><h3>&#128214; Overview</h3>';
    if(isExpandable){
      html+='<div class="desc" id="descContent">'+renderMarkdown(short)+'</div>';
      html+='<span class="desc-toggle" id="descToggle" onclick="toggleDescription()">Show full description &#9660;</span>';
    }else{
      html+='<div class="desc">'+renderMarkdown(full)+'</div>';
    }
    html+='</div>';
  }
  // Leads to
  if(t.leadsTo&&t.leadsTo.length){
    html+='<div class="dep-section fade-in"><h4>&#10148; Next Topics ('+t.leadsTo.length+')</h4><div class="dep-list">';
    t.leadsTo.forEach(l=>{html+='<span class="dep-tag next" onclick="selectTopic(\''+esc(l.nodeId)+'\')">'+esc(l.title)+'</span>'});
    html+='</div></div>';
  }
  if(t.resources&&t.resources.length){
    html+='<div class="content-card fade-in"><h3>&#127891; Free Resources ('+t.resources.length+')</h3><ul class="resource-list">';
    t.resources.forEach(r=>{html+='<li><a class="resource-link" href="'+esc(r.url)+'" target="_blank" rel="noopener"><span class="res-type '+typeClass(r.type)+'">'+esc(typeLabel(r.type))+'</span><span class="res-title">'+esc(r.title)+'</span></a></li>'});
    html+='</ul></div>';
  }
  if(!t.description&&(!t.resources||!t.resources.length)){html+='<div class="content-card" style="text-align:center;padding:40px;color:var(--muted)"><p>No content available for this item.</p></div>'}
  // Project suggestions
  html+='<div id="projectSuggestions"></div>';
  html+='<div class="content-card fade-in"><div class="notes-label"><span>&#128221; Notes</span>'+(prog.timestamp?'<span class="notes-timestamp">Completed: '+new Date(prog.timestamp).toLocaleDateString()+'</span>':'')+'</div><textarea class="notes-area" placeholder="Add notes about this topic..." oninput="updateNotes(\''+esc(nid)+'\',this.value)">'+esc(prog.notes||'')+'</textarea></div>';
  det.innerHTML=html;det.scrollTop=0;
  document.getElementById('mainContent').scrollTop=0;
  highlightGraphNode(nid);
  // Load project suggestions
  loadProjectSuggestions();
}
let _expandedDesc=false;

// ===== Graph =====
function renderGraph(){
  if(!currentSlug)return;
  const svg=document.getElementById('roadmapSvg');
  const rd=DATA_CACHE[currentSlug];if(!rd)return;
  const nodes=rd.nodes,edges=rd.edges;
  const skipTypes=new Set(['horizontal','vertical','label']);
  const renderable=Object.values(nodes).filter(n=>!skipTypes.has(n.type));
  function nodeSize(n){
    const len=(n.label||'').length;
    if(n.type==='title')return{w:Math.max(140,len*9+30),h:28};
    if(n.type==='paragraph')return{w:Math.max(160,len*7+20),h:20};
    if(n.type==='section')return{w:Math.max(120,len*8+24),h:32};
    if(n.type==='button')return{w:Math.max(100,len*8+20),h:30};
    return{w:Math.max(110,len*8+24),h:30};
  }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  renderable.forEach(n=>{const s=nodeSize(n);if(n.x<minX)minX=n.x;if(n.y<minY)minY=n.y;if(n.x+s.w>maxX)maxX=n.x+s.w;if(n.y+s.h>maxY)maxY=n.y+s.h});
  if(!isFinite(minX))return;
  const pad=80;const vbW=maxX-minX+pad*2,vbH=maxY-minY+pad*2;
  const rect=svg.parentElement.getBoundingClientRect();const cw=rect.width||800,ch=rect.height||600;
  const sx=cw/vbW,sy=ch/vbH;graphScale=Math.min(sx,sy,2);
  graphPanX=(cw-vbW*graphScale)/2-(minX-pad)*graphScale;
  graphPanY=(ch-vbH*graphScale)/2-(minY-pad)*graphScale;
  const sizeMap={};renderable.forEach(n=>{sizeMap[n.id]=nodeSize(n)});
  let svgC='<g id="graphGroup">';
  const cs=getComputedStyle(document.documentElement);
  const edgeColor=cs.getPropertyValue('--muted').trim()||'#94a3b8';
  const fills={topic:cs.getPropertyValue('--badge-article-bg').trim()||'#dbeafe',subtopic:cs.getPropertyValue('--badge-official-bg').trim()||'#dcfce7',button:cs.getPropertyValue('--badge-course-bg').trim()||'#fef3c7',title:cs.getPropertyValue('--hover').trim()||'#f1f5f9',section:cs.getPropertyValue('--bg').trim()||'#f8fafc',paragraph:cs.getPropertyValue('--bg').trim()||'#f8fafc',default:cs.getPropertyValue('--bg').trim()||'#f8fafc'};
  const strokes={topic:cs.getPropertyValue('--accent').trim()||'#2563eb',subtopic:'#16a34a',button:'#f59e0b',title:cs.getPropertyValue('--muted').trim()||'#334155',default:cs.getPropertyValue('--border').trim()||'#cbd5e1'};
  edges.forEach(e=>{
    const src=nodes[e.source],tgt=nodes[e.target];if(!src||!tgt||!sizeMap[e.source]||!sizeMap[e.target])return;
    const ss=sizeMap[e.source],ts=sizeMap[e.target];
    const x1=src.x+ss.w/2,y1=src.y+ss.h,x2=tgt.x+ts.w/2,y2=tgt.y;
    const midY=(y1+y2)/2;
    svgC+='<path class="edge-line" d="M'+x1+','+y1+' L'+x1+','+midY+' L'+x2+','+midY+' L'+x2+','+y2+'" stroke="'+edgeColor+'" stroke-width="2" fill="none" stroke-dasharray="6,4"/>';
  });
  const progress=loadProgress();
  renderable.forEach(n=>{
    const s=sizeMap[n.id];const ps=(progress[n.id]||{}).status||'not-started';
    let fill=fills[n.type]||fills.default,stroke=strokes[n.type]||strokes.default;
    if(n.type==='topic'||n.type==='subtopic'||n.type==='button'){
      if(ps==='completed'){fill=cs.getPropertyValue('--status-completed-bg').trim()||'#dcfce7';stroke=cs.getPropertyValue('--status-completed').trim()||'#16a34a'}
      else if(ps==='in-progress'){fill=cs.getPropertyValue('--status-inprogress-bg').trim()||'#fef3c7';stroke=cs.getPropertyValue('--status-inprogress').trim()||'#f59e0b'}
    }
    const lClass=n.type==='title'?'node-title':n.type==='paragraph'?'node-paragraph':n.type==='section'?'node-label-text':'node-label';
    const clickable=n.type==='topic'||n.type==='subtopic'||n.type==='button';
    const maxC=Math.floor(s.w/7);let dl=n.label;if(n.label.length>maxC&&n.type!=='title'&&n.type!=='paragraph')dl=n.label.substring(0,maxC-1)+'\u2026';
    svgC+='<g data-nodeid="'+esc(n.id)+'"'+(clickable?' style="cursor:pointer" onclick="if(!didDrag)selectTopicFromGraph(\''+esc(n.id)+'\')"':'')+'>';
    svgC+='<rect class="node-rect'+(selectedTopicId===n.id?' highlighted':'')+'" x="'+n.x+'" y="'+n.y+'" width="'+s.w+'" height="'+s.h+'" rx="7" ry="7" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
    svgC+='<text class="'+lClass+'" x="'+(n.x+s.w/2)+'" y="'+(n.y+s.h/2)+'" font-size="'+(n.type==='title'?13:n.type==='paragraph'?10:11)+'">'+esc(dl)+'</text>';
    svgC+='</g>';
  });
  svgC+='</g>';svg.innerHTML=svgC;updateGraphTransform();
}
function updateGraphTransform(){const g=document.getElementById('graphGroup');if(g)g.setAttribute('transform','translate('+graphPanX+','+graphPanY+') scale('+graphScale+')')}
function selectTopicFromGraph(nid){
  // In split view: keep the layout, just show the topic detail
  if(currentView==='split'){
    selectTopic(nid);
    return;
  }
  // In graph-only view: switch to split so user sees both graph + detail
  if(currentView==='graph'){
    currentView='split';
    document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
    const st=document.querySelector('.view-tab[data-view="split"]');if(st)st.classList.add('active');
    applyViewLayout('split');
    requestAnimationFrame(()=>{requestAnimationFrame(()=>renderGraph())});
    selectTopic(nid);
    return;
  }
  // In list view: normal behavior
  selectTopic(nid);
}
function highlightGraphNode(nid){
  if(currentView!=='graph'&&currentView!=='split')return;
  document.querySelectorAll('.node-rect.highlighted').forEach(el=>el.classList.remove('highlighted'));

// Pan/zoom
const svgEl=document.getElementById('roadmapSvg');
svgEl.addEventListener('mousedown',e=>{isPanning=true;didDrag=false;panStartX=e.clientX-graphPanX;panStartY=e.clientY-graphPanY;panMouseDownX=e.clientX;panMouseDownY=e.clientY});
svgEl.addEventListener('mousemove',e=>{if(!isPanning)return;const dx=e.clientX-panMouseDownX,dy=e.clientY-panMouseDownY;if(Math.abs(dx)>4||Math.abs(dy)>4)didDrag=true;graphPanX=e.clientX-panStartX;graphPanY=e.clientY-panStartY;updateGraphTransform()});
svgEl.addEventListener('mouseup',()=>{isPanning=false;setTimeout(()=>{didDrag=false},0)});
svgEl.addEventListener('mouseleave',()=>{isPanning=false;didDrag=false});
svgEl.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1;graphScale=Math.max(.2,Math.min(5,graphScale*d));updateGraphTransform()});
document.getElementById('zoomIn').addEventListener('click',()=>{graphScale=Math.min(5,graphScale*1.2);updateGraphTransform()});
document.getElementById('zoomOut').addEventListener('click',()=>{graphScale=Math.max(.2,graphScale*.8);updateGraphTransform()});
document.getElementById('zoomFit').addEventListener('click',()=>renderGraph());
// Tooltip
const tooltip=document.getElementById('graphTooltip');
svgEl.addEventListener('mouseover',e=>{const g=e.target.closest('[data-nodeid]');if(!g)return;const rd=DATA_CACHE[currentSlug];if(!rd)return;const n=rd.nodes[g.dataset.nodeid];if(!n||(n.type!=='topic'&&n.type!=='subtopic'&&n.type!=='button'))return;tooltip.textContent=n.label;tooltip.style.display='block'});
svgEl.addEventListener('mousemove',e=>{if(tooltip.style.display==='block'){tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-30)+'px'}});
svgEl.addEventListener('mouseout',e=>{if(!e.target.closest||!e.target.closest('[data-nodeid]'))tooltip.style.display='none'});
// Resize
window.addEventListener('resize',()=>{if(currentView==='graph')renderGraph()});

// ===== Export / Import / Reset =====
function exportProgress(){
  const data={progress:loadProgress(),badges:loadBadges(),lastViewed:getLastViewed()};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='roadmap-progress.json';a.click();URL.revokeObjectURL(a.href);
}
function importProgress(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();
    reader.onload=ev=>{try{const imported=JSON.parse(ev.target.result);
      if(imported.progress){const existing=loadProgress();saveProgress({...existing,...imported.progress})}
      if(imported.badges){const existing=loadBadges();saveBadges({...existing,...imported.badges})}
      if(imported.lastViewed){const existing=getLastViewed();localStorage.setItem(LVK,JSON.stringify({...existing,...imported.lastViewed}))}
      updateProgressStats();buildSidebar(document.getElementById('topicSearch').value.trim());if(selectedTopicId)selectTopic(selectedTopicId);buildHome()
    }catch(err){alert('Invalid JSON file')}};reader.readAsText(file)};
  input.click();
}
function resetProgress(){
  if(!confirm('Reset ALL progress? This cannot be undone.'))return;
  localStorage.removeItem(PK);localStorage.removeItem(BK);localStorage.removeItem(LVK);
  updateProgressStats();buildSidebar(document.getElementById('topicSearch').value.trim());
  if(selectedTopicId)selectTopic(selectedTopicId);buildHome();
}

  }

  // Route from hash on load
  routeFromHash();

// ===== Hash-based routing =====
function routeFromHash(){
  const hash=location.hash.replace(/^#/,'');
  if(!hash){goHome(false);return}
  const parts=hash.split('/');
  const slug=parts[0];
  if(!INDEX.meta||!INDEX.meta[slug]){goHome(false);return}
  openRoadmap(slug,false).then(()=>{
    if(parts[1]){
      setTimeout(()=>selectTopic(parts[1],false),100);
    }
  });
}
window.addEventListener('popstate',e=>{
  const hash=location.hash.replace(/^#/,'');
  if(!hash){
    goHome(false);
    return;
  }
  const parts=hash.split('/');
  const slug=parts[0];
  if(!INDEX.meta||!INDEX.meta[slug]){goHome(false);return}
  // If we're already on this roadmap, just navigate to topic
  if(currentSlug===slug&&currentPage==='roadmap'){
    if(parts[1]){
      selectTopic(parts[1],false);
    }else{
      showWelcome();selectedTopicId=null;
      buildSidebar(document.getElementById('topicSearch').value.trim());
    }
  }else{
    openRoadmap(slug,false).then(()=>{
      if(parts[1]){
        setTimeout(()=>selectTopic(parts[1],false),100);
      }
    });
  }
});
